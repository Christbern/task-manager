spring.application.name=backend

# Profil actif (dev par défaut ; en prod on passera SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Base de données (surchargée par les profils / variables d'env) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# En dev, valeur par défaut fournie. En prod, DOIT être injectée via variable d'environnement (voir README).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator (santé, utile pour Cloud Run) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=${PORT:8080}
