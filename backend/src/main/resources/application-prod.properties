# Activé sur Cloud Run via SPRING_PROFILES_ACTIVE=prod (voir workflow GitHub Actions).
#
# Différence clé avec le dev local : pas d'IP/port MySQL classique. Cloud Run se connecte
# à Cloud SQL via un socket Unix monté automatiquement à /cloudsql/<INSTANCE_CONNECTION_NAME>,
# grâce au connecteur "Cloud SQL Socket Factory" (voir pom.xml) + l'option
# --add-cloudsql-instances passée au déploiement. C'est plus sûr qu'une IP publique :
# aucune exposition de la base sur Internet, tout passe par ce socket chiffré.

spring.datasource.url=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# En prod, Hibernate ne doit jamais modifier automatiquement le schéma en continu ;
# "update" reste acceptable pour ce test technique (pas de migration Flyway/Liquibase demandée),
# mais c'est un point à mentionner si on te le demande en entretien.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
